# 作者の指示（2026-11-05）：作者が動かすと決めるまで、手で動かすときだけ（push・PR では動かない）。動かすときは、下の on: を push: と pull_request: にもどす
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/furigana.cjs --check
      - run: npx vitest run
      - run: npm run check:quotes -- --allow-missing-bodies
      - run: npm run build
      # Playwright（npm run test:a11y）は、いまは入れない。ローカルの Windows の Edge を使う設定のため。
