# kurashi の公開（Cloudflare Workers。SPEC 16章・13.3）。作者の手順は README.md の「公開」。
# 静的なファイル（npm run build の dist/）と、/api/*（worker/index.ts）を1つの Worker で配る。
# 保存の仕組みは、報告ボタン（A-9）の KV「REPORTS」と、使われ方の数（Analytics Engine「EV」）だけ。名前・連絡先・IP は入れない。ログ・監視は切る（13.3）。
name = "kurashi"
main = "worker/index.ts"
compatibility_date = "2026-11-01"
# 本番のキーは Worker のシークレット（npx wrangler secret put ANTHROPIC_API_KEY）。ここには書かない
workers_dev = true

[vars]
# 写真を読むモデル（SPEC 6A.9）。アプリの中は安いモデル（作者の指示）
READ_MODEL = "claude-haiku-5-5"

[assets]
directory = "./dist"
binding = "ASSETS"
# 画面の URL（/move・/c/… など）は index.html を返す
not_found_handling = "single-page-application"
# /api/* だけ Worker のコードを先に通す
run_worker_first = ["/api/*"]

[observability]
enabled = false

# 使われ方の数（SPEC 13.4。作者の指示 2026-11-07）。数だけ（ID・クッキー・IP・答えは入れない）。データセットは最初の書き込みで自動で作られ、約3か月で消える。
# 作者の画面（/review の「使われ方」）で読むには、シークレット CF_ACCOUNT_ID と CF_API_TOKEN（Account Analytics の読み取りだけ）を入れる
[[analytics_engine_datasets]]
binding = "EV"
dataset = "kurashi_ev"

# 公開の URL（作者が Cloudflare で eringo.io を持っているとき）。待ち：作者の確認のあとで外す
# routes = [{ pattern = "kurashi.eringo.io", custom_domain = true }]

# 報告ボタン（A-9。作者の指示 2026-11-06）。待ち：作者が KV を作る（npx wrangler kv namespace create REPORTS）→ 出た id を下に書いて # を外す。
# 一覧を見るトークンは npx wrangler secret put REPORTS_TOKEN（ここには書かない）。KV が無いあいだは、Worker のメモリの中だけ（消える）。
# [[kv_namespaces]]
# binding = "REPORTS"
# id = "<作者が作った KV の id>"
